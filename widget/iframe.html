<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Savanna Learning Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Iframe-specific overrides — full-height shell */
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; }
  </style>
</head>
<body>

<!-- Skip link -->
<a href="#chat-input" class="skip-link">Skip to chat input</a>

<!-- ── Escalation consent modal ──────────────────────────── -->
<div id="escalation-modal" class="modal-backdrop" hidden
     role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title">Share your screen with a human agent?</h2>
    <p>
      To get personalised help, an operator will view your screen.
      You will be asked to choose what to share. You can stop at any time.
    </p>
    <div class="modal-actions">
      <button type="button" id="modal-cancel-btn" class="btn btn-ghost">Cancel</button>
      <button type="button" id="modal-confirm-btn" class="btn btn-primary">Share &amp; Connect</button>
    </div>
  </div>
</div>

<!-- ── Widget shell ───────────────────────────────────────── -->
<main class="widget-shell" role="main" aria-label="Savanna Learning Assistant">

  <!-- Header -->
  <header class="widget-header" role="banner">
    <h1 id="widget-title">Savanna Assistant</h1>

    <!-- Multilingual Language Selector (8 Languages + Auto-Detect) -->
    <div class="lang-select-container">
      <label for="lang-select" class="sr-only">Choose language / ቋንቋ ይምረጡ</label>
      <select id="lang-select" class="lang-select" aria-label="Choose Assistant Language / ቋንቋ ይምረጡ" title="Choose language / ቋንቋ ይምረጡ">
        <option value="auto">✨ Auto</option>
        <option value="en">EN • English</option>
        <option value="am">AM • አማርኛ</option>
        <option value="om">OM • Oromoo</option>
        <option value="ti">TI • ትግርኛ</option>
        <option value="so">SO • Soomaali</option>
        <option value="ar">AR • العربية (RTL)</option>
        <option value="sw">SW • Kiswahili</option>
        <option value="fr">FR • Français</option>
      </select>
    </div>
    <button type="button" id="lang-toggle-btn" style="display:none" aria-hidden="true"></button>

    <!-- Voice Guide (Self-voicing focus reader) -->
    <button type="button" id="voice-guide-btn" class="icon-btn"
            aria-pressed="true"
            aria-label="Voice guidance enabled. Click to disable."
            title="Voice guidance (reads elements on focus)">
      <svg id="voice-guide-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
    </button>

    <!-- Simple Mode (Plain language for cognitive accessibility) -->
    <button type="button" id="simple-mode-btn" class="icon-btn"
            aria-pressed="false"
            aria-label="Simple mode off. Click to enable plain language."
            title="Simple mode / ቀላል ሁነታ (Plain language explanations)">
      <span style="font-weight: 800; font-size: 0.85rem; letter-spacing: -0.05em;" aria-hidden="true">Aa</span>
    </button>

    <!-- Minimise -->
    <button type="button" id="minimize-btn" class="icon-btn"
            aria-label="Minimise assistant">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <!-- Close -->
    <button type="button" id="close-btn" class="icon-btn"
            aria-label="Close assistant">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </header>

  <!-- ── Error / alert zone ──────────────────────────────── -->
  <div id="error-zone" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <!-- ── Ticket confirmation zone ───────────────────────── -->
  <div id="ticket-zone" aria-live="polite" aria-atomic="true"></div>

  <!-- ── Language suggestion banner ─────────────────────── -->
  <aside id="lang-suggestion-banner" class="lang-suggestion-banner" hidden
         role="region" aria-label="Language suggestion">
    <div class="suggestion-content">
      <span class="suggestion-icon" aria-hidden="true">🌐</span>
      <span id="suggestion-text">Would you like to switch language?</span>
    </div>
    <div class="suggestion-actions">
      <button type="button" id="suggestion-accept-btn" class="btn btn-sm btn-primary">Switch</button>
      <button type="button" id="suggestion-dismiss-btn" class="btn btn-sm btn-ghost">Dismiss</button>
    </div>
  </aside>

  <!-- ── Message area ────────────────────────────────────── -->
  <div class="message-area" aria-label="Conversation">
    <ul id="message-list"
        role="log"
        aria-live="polite"
        aria-atomic="false"
        aria-label="Conversation"
        aria-busy="false">
    </ul>
  </div>

  <!-- ── Input area ──────────────────────────────────────── -->
  <section class="input-area" aria-label="Message input">
    <div id="voice-recording-status" class="voice-status-banner" role="status" aria-live="polite" style="display: none;"></div>
    <div class="input-wrapper">
      <div class="input-label-wrapper">
        <label id="chat-input-label" for="chat-input" class="input-label">
          Message (English or Amharic)
        </label>
        <textarea
          id="chat-input"
          name="chat-input"
          aria-label="Type your message in English or Amharic"
          aria-describedby="chat-input-label"
          rows="2"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
      </div>

      <div class="input-actions">
        <!-- Voice input -->
        <button type="button" id="voice-btn" class="btn btn-ghost btn-icon"
                aria-label="Start voice input"
                aria-pressed="false"
                title="Voice input">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>

        <!-- Send -->
        <button type="button" id="send-btn" class="btn btn-primary"
                aria-label="Send message"
                disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          <span id="send-btn-label">Send</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ── Escalation bar ──────────────────────────────────── -->
  <div class="escalation-bar" role="complementary" aria-label="Human assistance">
    <button type="button" id="escalate-btn"
            aria-label="Escalate to a human agent">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.63 3.42 2 2 0 0 1 3.6 1.26h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9a16 16 0 0 0 6 6l1.06-1.06a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21.73 16z"/>
      </svg>
      <span id="escalate-label">Get human help</span>
    </button>
  </div>

</main>

<script>

  /* ── Resolve API base URL & initial language ────────────── */
  const params    = new URLSearchParams(window.location.search);

  const paramLang = params.get('lang');

  const SESSION_KEY = 'savanna_session_id';

    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
  }
  if (!sessionStorage.getItem(SESSION_KEY)) {
    sessionStorage.setItem(SESSION_KEY, uuidv4());
  }
  const sessionId = sessionStorage.getItem(SESSION_KEY);
  const history   = []; // { role: 'user'|'assistant', content: string }

  const SUGGESTION_DISMISSED_KEY = 'savanna_suggestion_dismissed';

    'ti': 'ti-ET',
    'ar': 'ar-SA',

    'so': 'so-SO',
    'sw': 'sw-KE',
    'fr': 'fr-FR',
    'auto': 'en-US'

  let currentLanguage = localStorage.getItem(LANG_KEY);
  if (!currentLanguage) {
    if (paramLang && (paramLang === 'auto' || BCP47_MAP[paramLang])) {
      currentLanguage = paramLang;
    } else {
      currentLanguage = 'auto';
    }

  let voiceGuideEnabled = localStorage.getItem(VOICE_GUIDE_KEY) !== 'false';
  let simpleModeEnabled = localStorage.getItem(SIMPLE_MODE_KEY) === 'true';
  let isListening = false;
  let recognition = null;

  function getI18n() {
    if (currentLanguage !== 'auto' && i18n[currentLanguage]) {
      return i18n[currentLanguage];
    }
    return i18n.en;
  }

  /* ── Apply language & RTL handling ───────────────────────── */
  function applyLanguage() {
    const isRtl = (currentLanguage === 'ar');
    const t = getI18n();

    htmlEl.setAttribute('lang', (currentLanguage === 'auto') ? 'en' : currentLanguage);
    htmlEl.setAttribute('dir', isRtl ? 'rtl' : 'ltr');

    if (langSelect) langSelect.value = currentLanguage;

    widgetTitle.textContent = t.title;

    voiceGuideBtn.setAttribute('aria-label', voiceGuideEnabled ? t.voiceGuideOn : t.voiceGuideOff);
    voiceGuideBtn.setAttribute('aria-pressed', voiceGuideEnabled ? 'true' : 'false');
    voiceGuideBtn.style.opacity = voiceGuideEnabled ? '1' : '0.6';

    simpleModeBtn.setAttribute('aria-label', simpleModeEnabled ? t.simpleModeOn : t.simpleModeOff);
    simpleModeBtn.setAttribute('aria-pressed', simpleModeEnabled ? 'true' : 'false');
    simpleModeBtn.style.background = simpleModeEnabled ? 'rgba(255,255,255,0.3)' : '';
    simpleModeBtn.style.opacity = simpleModeEnabled ? '1' : '0.6';

    inputLabel.textContent = t.inputPlaceholder;
    chatInput.setAttribute('placeholder', t.inputPlaceholder);
    chatInput.setAttribute('aria-label', t.inputPlaceholder);
    chatInput.setAttribute('dir', isRtl ? 'rtl' : 'ltr');

    sendBtnLabel.textContent  = t.send;
    sendBtn.setAttribute('aria-label', t.send + ' message');
    voiceBtn.setAttribute('aria-label', isListening ? t.voiceStop : t.voiceStart);
    escalateLabel.textContent = t.escalate;
    escalateBtn.setAttribute('aria-label', t.escalate + ' — escalate to a human agent');
    closeBtn.setAttribute('aria-label',    t.closeLabel);
    minimizeBtn.setAttribute('aria-label', t.minimiseLabel);

    if (modalTitle) modalTitle.textContent = t.modalTitle;
    if (modalDesc) modalDesc.textContent = t.modalDesc;
    if (modalCancel) modalCancel.textContent = t.modalCancel;
    if (modalConfirm) modalConfirm.textContent = t.modalConfirm;

    localStorage.setItem(LANG_KEY, currentLanguage);
    if (recognition) recognition.lang = BCP47_MAP[currentLanguage] || 'en-US';

    try {
      parent.postMessage({ type: 'savanna:lang_change', lang: currentLanguage }, '*');
    } catch (_) {}
    try {
      if (typeof prewarmWidgetAudio === 'function') prewarmWidgetAudio();
    } catch (_) {}
  }

  applyLanguage();

  /* ── Accessible Regional Language Suggestion Banner ───────── */
  const REGIONAL_SUGGESTIONS = {
    'Africa/Khartoum': 'ar',
    'Africa/Juba': 'ar',
    'Africa/Mogadishu': 'so',
    'Africa/Nairobi': 'sw',
    'Africa/Asmara': 'ti',
    'Africa/Djibouti': 'so',
    'Africa/Cairo': 'ar'
  };

  const LANG_NAMES = {
    'en': 'English',
    'am': 'አማርኛ',
    'om': 'Afaan Oromoo',
    'ti': 'ትግርኛ',
    'so': 'Soomaali',
    'ar': 'العربية',
    'sw': 'Kiswahili',
    'fr': 'Français'
  };

  function checkLanguageSuggestion() {
    if (!suggestionBanner) return;
    if (sessionStorage.getItem(SUGGESTION_DISMISSED_KEY)) return;
    if (localStorage.getItem(USER_CHOSEN_KEY) === 'true') return;

    let candidate = null;

    // 1. Check browser navigator languages
    const browserLangs = navigator.languages || [navigator.language || ''];
    for (const bl of browserLangs) {
      const code = (bl || '').toLowerCase().split(/[-_]/)[0];
      if (code && code !== 'en' && BCP47_MAP[code]) {
        candidate = code;
        break;
      }
    }

    // 2. Coarse regional timezone hint
    if (!candidate) {
      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        if (REGIONAL_SUGGESTIONS[tz]) {
          candidate = REGIONAL_SUGGESTIONS[tz];
        } else if (tz === 'Africa/Addis_Ababa' && currentLanguage === 'en') {
          candidate = 'am';
        }
      } catch (_) {}
    }

    if (candidate && candidate !== currentLanguage && candidate !== 'en') {
      const targetI18n = i18n[candidate] || i18n.en;
      suggestionText.textContent = targetI18n.suggestionText || `Would you like to switch to ${LANG_NAMES[candidate]}?`;
      suggestionAccept.textContent = targetI18n.switchBtn || 'Switch';
      suggestionDismiss.textContent = targetI18n.dismissBtn || 'Dismiss';
      suggestionBanner.removeAttribute('hidden');

      suggestionAccept.onclick = function () {
        currentLanguage = candidate;
        localStorage.setItem(USER_CHOSEN_KEY, 'true');
        applyLanguage();
        suggestionBanner.setAttribute('hidden', '');
        speakFocus((LANG_NAMES[candidate] || candidate) + ' selected');
      };

      suggestionDismiss.onclick = function () {
        suggestionBanner.setAttribute('hidden', '');
        sessionStorage.setItem(SUGGESTION_DISMISSED_KEY, 'true');
      };
    }
  }

  // Run suggestion check on load
  setTimeout(checkLanguageSuggestion, 300);

  /* ── Language Selector Listener ──────────────────────────── */
  if (langSelect) {
    langSelect.addEventListener('change', function () {
      currentLanguage = langSelect.value;
      localStorage.setItem(USER_CHOSEN_KEY, 'true');
      if (suggestionBanner) suggestionBanner.setAttribute('hidden', '');
      applyLanguage();
      const speakMap = {
        'en': 'Language set to English',
        'am': 'ቋንቋ ወደ አማርኛ ተቀይሯል',
        'om': 'Afaan Oromootti jijjiirameera',
        'ti': 'ቋንቋ ናብ ትግርኛ ተቐይሩ',
        'so': 'Luuqadda waxaa loo beddelay Soomaali',
        'ar': 'تم تغيير اللغة إلى العربية',
        'sw': 'Lugha imebadilishwa kuwa Kiswahili',
        'fr': 'Langue changée en français',
        'auto': 'Auto-detection enabled'
      };
      speakFocus(speakMap[currentLanguage] || 'Language updated');
    });

  /* ── Voice guidance toggle ───────────────────────────────── */
  voiceGuideBtn.addEventListener('click', function () {
    voiceGuideEnabled = !voiceGuideEnabled;
    localStorage.setItem(VOICE_GUIDE_KEY, voiceGuideEnabled ? 'true' : 'false');
    applyLanguage();
    const t = getI18n();
    speakFocus(voiceGuideEnabled ? t.voiceGuideActive : t.voiceGuideInactive);

  /* ── Simple Mode (plain language) toggle ─────────────────── */
  simpleModeBtn.addEventListener('click', function () {
    simpleModeEnabled = !simpleModeEnabled;
    localStorage.setItem(SIMPLE_MODE_KEY, simpleModeEnabled ? 'true' : 'false');
    applyLanguage();
    const t = getI18n();
    speakFocus(simpleModeEnabled ? t.simpleModeActive : t.simpleModeInactive);

  /* ── Close / minimise ────────────────────────────────────── */
  closeBtn.addEventListener('click', function () {
    parent.postMessage({ type: 'close' }, '*');

  minimizeBtn.addEventListener('click', function () {
    parent.postMessage({ type: 'close' }, '*');

  /* ── Built-in Focus Reader & Message Audio Playback ─────── */
  const messageAudioCache = new Map();
  let activeMessageAudio = null;
  let activeAudioButton = null;
  let activeAudio = null;

  function stopActiveAudio() {
    if (activeMessageAudio) {
      try {
        activeMessageAudio.pause();
        activeMessageAudio.currentTime = 0;
      } catch (_) {}
      activeMessageAudio = null;
    }
    if (activeAudioButton) {
      activeAudioButton.classList.remove('playing');
      const t = getI18n();
      activeAudioButton.setAttribute('aria-label', (t.listen || 'Listen') + ' to response');
      const icon = activeAudioButton.querySelector('.audio-btn-icon');
      const label = activeAudioButton.querySelector('.audio-btn-label');
      if (icon) icon.textContent = '🔊';
      if (label) label.textContent = t.listen || 'Listen';
      activeAudioButton = null;
    }
  }

  async function toggleMessageAudio(btn, text, lang) {
    if (!text) return;
    const targetLang = lang || currentLanguage || 'en';
    const t = getI18n();

    // If currently playing this message, clicking stops it
    if (activeAudioButton === btn && activeMessageAudio && !activeMessageAudio.paused) {
      stopActiveAudio();
      return;
    }

    // Stop any other active message audio
    stopActiveAudio();

    const icon = btn.querySelector('.audio-btn-icon');
    const label = btn.querySelector('.audio-btn-label');
    if (label) label.textContent = t.audioLoading || 'Loading...';
    btn.setAttribute('aria-label', t.audioLoading || 'Loading audio...');

    const cacheKey = targetLang + ':' + text;

    try {
      let audioUrl = messageAudioCache.get(cacheKey);
      if (!audioUrl) {
        const resp = await fetch(apiUrl + '/speech/synthesize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, language: targetLang })
        });

        if (resp.status === 501) {
          showError(t.ttsUnavailable || 'Voice synthesis not yet available for this language. Text response is provided above.');
          if (label) label.textContent = t.listen || 'Listen';
          btn.setAttribute('aria-label', (t.listen || 'Listen') + ' to response');
          return;
        }

        if (!resp.ok) {
          showError(t.recUnavailable || 'Voice synthesis currently unavailable.');
          if (label) label.textContent = t.listen || 'Listen';
          btn.setAttribute('aria-label', (t.listen || 'Listen') + ' to response');
          return;
        }

        const blob = await resp.blob();
        audioUrl = URL.createObjectURL(blob);
        messageAudioCache.set(cacheKey, audioUrl);
      }

      const audio = new Audio(audioUrl);
      activeMessageAudio = audio;
      activeAudioButton = btn;

      btn.classList.add('playing');
      btn.setAttribute('aria-label', (t.stopAudio || 'Stop') + ' reading response');
      if (icon) icon.textContent = '⏹️';
      if (label) label.textContent = t.stopAudio || 'Stop';

      audio.onended = function () {
        stopActiveAudio();
      };
      audio.onerror = function () {
        stopActiveAudio();
      };

      await audio.play();
    } catch (err) {
      console.error('[Savanna widget] Audio playback error:', err);
      stopActiveAudio();
      showError(t.recUnavailable || 'Voice playback error.');
    }
  }

  const widgetAudioCache = new Map();
  let activeSpeechAbort = null;
  let focusDebounceTimer = null;

  async function playSpeechAudio(text, lang) {
    if (!text) return;
    const targetLang = lang || currentLanguage || 'en';

    // 1. Check if browser has a matching local voice (instant, 0ms)
    if (window.speechSynthesis && window.speechSynthesis.getVoices) {
      try {
        const voices = window.speechSynthesis.getVoices();
        const prefix = targetLang.toLowerCase();
        const hasVoice = voices.some(function (v) {
          return v.lang && v.lang.toLowerCase().startsWith(prefix);
        });
        if (hasVoice) {
          window.speechSynthesis.cancel();
          const utt = new SpeechSynthesisUtterance(text);
          utt.lang = BCP47_MAP[targetLang] || 'en-US';
          utt.rate = 1.15;
          window.speechSynthesis.speak(utt);
          return;
        }
      } catch (_) {}
    }

    // 2. Client-side memory cache (Instant 0ms playback!)
    const cacheKey = targetLang + ':' + text;
    if (widgetAudioCache.has(cacheKey)) {
      try {
        if (activeAudio) {
          activeAudio.pause();
          activeAudio = null;
        }
        activeAudio = new Audio(widgetAudioCache.get(cacheKey));
        activeAudio.play().catch(function () {});
        return;
      } catch (_) {}
    }

    // 3. Otherwise stream synthesized neural / fallback audio with abort capability
    try {
      if (activeSpeechAbort) {
        activeSpeechAbort.abort();
      }
      activeSpeechAbort = new AbortController();

      if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
      }

      const resp = await fetch(apiUrl + '/speech/synthesize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, language: targetLang }),
        signal: activeSpeechAbort.signal
      });
      if (resp.ok) {
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        widgetAudioCache.set(cacheKey, url);
        activeAudio = new Audio(url);
        activeAudio.onended = function () {
          activeAudio = null;
        };
        activeAudio.play().catch(function () {});
      }
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.debug('[Savanna widget] Speech notice:', err);
      }
    }
  }

  function speakFocus(text) {
    if (!voiceGuideEnabled || !text) return;
    playSpeechAudio(text, currentLanguage);
  }

  function prewarmWidgetAudio() {
    if (!voiceGuideEnabled || currentLanguage === 'en') return;
    const elements = [closeBtn, langSelect, voiceGuideBtn, simpleModeBtn, chatInput, voiceBtn, sendBtn, escalateBtn];
    let delay = 100;
    elements.forEach(function (el) {
      if (!el) return;
      const desc = getAccessibleDescription(el);
      if (!desc) return;
      const cacheKey = currentLanguage + ':' + desc;
      if (!widgetAudioCache.has(cacheKey)) {
        setTimeout(function () {
          fetch(apiUrl + '/speech/synthesize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: desc, language: currentLanguage })
          }).then(function (r) {
            if (r.ok) return r.blob();
          }).then(function (blob) {
            if (blob) widgetAudioCache.set(cacheKey, URL.createObjectURL(blob));
          }).catch(function () {});
        }, delay);
        delay += 120;
      }
    });
  }

  function getAccessibleDescription(el) {
    if (!el || el === document.body || el === document.documentElement) return null;
    const t = getI18n();

    let label = el.getAttribute('aria-label') || '';
    if (!label && el.getAttribute('aria-labelledby')) {
      const ref = document.getElementById(el.getAttribute('aria-labelledby'));
      if (ref) label = ref.textContent.trim();
    }
    if (!label && el.placeholder) label = el.placeholder;
    if (!label && el.title) label = el.title;
    if (!label && (el.tagName === 'BUTTON' || el.tagName === 'A')) {
      label = el.textContent.trim();
    }

    let role = el.getAttribute('role');
    if (!role) {
      if (el.tagName === 'BUTTON') role = t.roleButton;
      else if (el.tagName === 'A') role = t.roleLink;
      else if (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type === 'text')) {
        role = t.roleTextEntry;
      }
    }

    const states = [];
    if (el.hasAttribute('aria-pressed')) {
      const isPressed = el.getAttribute('aria-pressed') === 'true';
      states.push(isPressed ? t.statePressed : t.stateNotPressed);
    }
    if (el.hasAttribute('aria-expanded')) {
      const isExpanded = el.getAttribute('aria-expanded') === 'true';
      states.push(isExpanded ? t.stateExpanded : t.stateCollapsed);
    }
    if (el.disabled) {
      states.push(t.stateDisabled);
    }

    if (!label && !role) return null;
    return [label, role, states.join(', ')].filter(Boolean).join(', ');
  }

  document.addEventListener('focusin', function (e) {
    if (!voiceGuideEnabled) return;
    const desc = getAccessibleDescription(e.target);
    if (!desc) return;
    if (focusDebounceTimer) clearTimeout(focusDebounceTimer);
    focusDebounceTimer = setTimeout(function () {
      speakFocus(desc);
    }, 70);
  });

  /* ── Focus & message management (from parent) ───────────── */
  window.addEventListener('message', function (e) {
    if (!e.data || typeof e.data !== 'object') return;
    const t = getI18n();
    if (e.data.type === 'focus') {
      chatInput.focus();
      speakFocus(t.welcome);
    } else if (e.data.type === 'open_escalate') {
      openEscalModal();
      speakFocus(t.escalateAlert);
    } else if (e.data.type === 'set_lang' && e.data.lang) {
      if (BCP47_MAP[e.data.lang] || e.data.lang === 'auto') {
        currentLanguage = e.data.lang;
        localStorage.setItem(USER_CHOSEN_KEY, 'true');
        if (suggestionBanner) suggestionBanner.setAttribute('hidden', '');
        applyLanguage();
      }
    }
  });

  /* ── Double-Space Shortcut for Live Help Desk ───────────── */
  let lastSpaceTime = 0;
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.code === 'Space') {
      const isInput = (e.target === chatInput);
      if (isInput && chatInput.value && chatInput.value.trim().length > 0) {
        return;
      }
      const now = Date.now();
      if (now - lastSpaceTime < 450) {
        e.preventDefault();
        lastSpaceTime = 0;
        openEscalModal();
        speakFocus(getI18n().escalateAlert);
      } else {
        lastSpaceTime = now;
      }
    }
  });

  /* ── Send button enable/disable ──────────────────────────── */
  chatInput.addEventListener('input', function () {
    const hasText = chatInput.value.trim().length > 0;
    sendBtn.disabled = !hasText;
    inputLabel.classList.toggle('hidden', hasText);
    /* Auto-resize textarea */
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 128) + 'px';
  });

  /* Keyboard: Ctrl+Enter or Cmd+Enter to send */
  chatInput.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !sendBtn.disabled) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  /* ── Render helpers ──────────────────────────────────────── */
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatTime(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function appendMessage(role, content, citations, ethDate) {
    const li = document.createElement('li');
    li.className = 'message-item ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    bubble.textContent = content;

    // Dynamic language and script tagging for screen readers (WCAG 3.1.2)
    if (/[\u1200-\u137F]/.test(content)) {
      bubble.setAttribute('lang', (typeof currentLanguage !== 'undefined' && currentLanguage === 'ti') ? 'ti' : 'am');
    } else if (/[\u0600-\u06FF]/.test(content)) {
      bubble.setAttribute('dir', 'rtl');
      bubble.setAttribute('lang', 'ar');
      bubble.classList.add('rtl-msg');
    } else if (typeof currentLanguage !== 'undefined' && currentLanguage && currentLanguage !== 'en') {
      bubble.setAttribute('lang', currentLanguage);
    } else {
      bubble.setAttribute('lang', 'en');
    }

    const ts = document.createElement('time');
    ts.className = 'message-timestamp sr-only-ts';
    ts.setAttribute('datetime', new Date().toISOString());
    const dateText = (role === 'user' ? 'You, ' : 'Assistant, ') + formatTime(new Date()) + (ethDate ? ' • ' + ethDate : '');
    ts.textContent = dateText;

    li.appendChild(bubble);
    li.appendChild(ts);

    if (role === 'assistant' && content) {
      const audioControls = document.createElement('div');
      audioControls.className = 'message-audio-controls';
      const listenBtn = document.createElement('button');
      listenBtn.type = 'button';
      listenBtn.className = 'btn-audio-speak';
      const t = getI18n();
      listenBtn.setAttribute('aria-label', (t.listen || 'Listen') + ' to response');
      listenBtn.innerHTML = '<span class="audio-btn-icon" aria-hidden="true">🔊</span> <span class="audio-btn-label">' + (t.listen || 'Listen') + '</span>';

      const cleanContent = content.replace(/\[\d+\]/g, '').trim();
      const msgLang = currentLanguage;
      listenBtn.addEventListener('click', function () {
        toggleMessageAudio(listenBtn, cleanContent, msgLang);
      });
      audioControls.appendChild(listenBtn);
      li.appendChild(audioControls);
    }

    if (citations && citations.length > 0) {
      const citeDiv = document.createElement('div');
      citeDiv.className = 'citations';
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = 'Sources (' + citations.length + ')';
      const citeUl = document.createElement('ul');
      citations.forEach(function (c) {
        const item = document.createElement('li');
        const a = document.createElement('a');
        a.href = c.url || '#';
        a.textContent = c.title || c.url || 'Source';
        if (c.url) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        item.appendChild(a);
        citeUl.appendChild(item);
      });
      details.appendChild(summary);
      details.appendChild(citeUl);
      citeDiv.appendChild(details);
      li.appendChild(citeDiv);
    }

    messageList.appendChild(li);
    li.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return li;
  }

  function showThinking() {
    const li = document.createElement('li');
    li.id = 'thinking-indicator';
    li.setAttribute('aria-label', getI18n().thinking);
    li.innerHTML = `
      <div class="thinking-indicator" aria-hidden="true">
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
      </div>`;
    messageList.appendChild(li);
    li.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return li;
  }

  function removeThinking() {
    const el = document.getElementById('thinking-indicator');
    if (el) el.remove();
  }

  function showError(msg) {
    errorZone.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'error-alert';
    div.textContent = msg;
    errorZone.appendChild(div);
    setTimeout(function () { errorZone.innerHTML = ''; }, 8000);
  }

  /* ── Send message ────────────────────────────────────────── */
  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    /* Reset input */
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendBtn.disabled = true;
    inputLabel.classList.remove('hidden');

    /* Render user bubble */
    appendMessage('user', text, null);

    /* Dispatch event to parent host and custom element */
    parent.postMessage({
      type: 'db-assistant:question',
      question: text,
      language: currentLanguage
    }, '*');

    /* Track in history */
    history.push({ role: 'user', content: text });
    if (history.length > 20) history.splice(0, history.length - 20);

    /* Show loading */
    messageList.setAttribute('aria-busy', 'true');
    const thinkingEl = showThinking();

    /* POST /chat */
    try {
      const res = await fetch(apiUrl + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message:     text,
          language:    currentLanguage,
          session_id:  sessionId,
          history:     history.slice(-10),
          simple_mode: simpleModeEnabled
        })
      });

      removeThinking();
      messageList.setAttribute('aria-busy', 'false');

      if (!res.ok) {
        const errText = await res.text().catch(() => 'Unknown error');
        showError('Error ' + res.status + ': ' + errText);
        return;
      }

      const data = await res.json();
      const reply = (data.text || data.response || data.message || data.answer || '').toString();
      const cites = Array.isArray(data.citations) ? data.citations : [];
      const ethDate = data.ethiopian_date || null;

      appendMessage('assistant', reply, cites, ethDate);
      history.push({ role: 'assistant', content: reply });

      /* Note: TTS is on-demand via the "Listen" button on each message (never auto-played) */

      /* Notify parent of content height change */
      const totalH = document.documentElement.scrollHeight;
      parent.postMessage({ type: 'resize', height: totalH }, '*');

    } catch (err) {
      removeThinking();
      messageList.setAttribute('aria-busy', 'false');
      showError('Could not reach the assistant. Please check your connection.');
      console.error('[Savanna widget] fetch error:', err);
    }
  }

  /* ── Voice input (Dual-Mode: Server STT / MediaRecorder + Web Speech API) ── */
  let mediaRecorder = null;
  let audioChunks = [];
  const voiceStatusBanner = document.getElementById('voice-recording-status');

  function setupVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const hasMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

    if (!SR && !hasMedia) {
      voiceBtn.setAttribute('aria-disabled', 'true');
      voiceBtn.setAttribute('title', 'Voice input not supported in this browser');
      voiceBtn.style.opacity = '0.4';
      return;
    }

    function setRecordingState(recording) {
      isListening = recording;
      const t = getI18n();
      voiceBtn.setAttribute('aria-pressed', recording ? 'true' : 'false');
      voiceBtn.setAttribute('aria-label', recording ? (t.voiceStop || 'Stop voice input') : (t.voiceStart || 'Start voice input'));
      voiceBtn.style.color = recording ? 'var(--c-error)' : '';
    }

    function stopVoiceRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        try { mediaRecorder.stop(); } catch (_) {}
      } else if (recognition) {
        try { recognition.stop(); } catch (_) {}
      }
      setRecordingState(false);
    }

    if (SR) {
      try {
        recognition = new SR();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = BCP47_MAP[currentLanguage] || 'en-US';

        recognition.addEventListener('result', function (e) {
          const transcript = e.results[0][0].transcript;
          if (transcript) {
            chatInput.value = (chatInput.value ? chatInput.value + ' ' : '') + transcript;
            chatInput.dispatchEvent(new Event('input'));
            chatInput.focus();
            if (voiceStatusBanner) {
              voiceStatusBanner.className = 'voice-status-banner success';
              voiceStatusBanner.style.display = 'flex';
              const t = getI18n();
              voiceStatusBanner.textContent = t.recSuccess || '✓ Audio transcribed! You can edit text below before sending.';
              speakFocus(t.recSuccess || 'Speech transcribed. Review your question in the text box and press Send.');
              setTimeout(function () {
                if (voiceStatusBanner.classList.contains('success')) voiceStatusBanner.style.display = 'none';
              }, 4500);
            }
          }
        });

        recognition.addEventListener('end', function () {
          setRecordingState(false);
          if (voiceStatusBanner && voiceStatusBanner.classList.contains('recording')) {
            voiceStatusBanner.style.display = 'none';
          }
        });

        recognition.addEventListener('error', function (e) {
          setRecordingState(false);
          if (voiceStatusBanner) voiceStatusBanner.style.display = 'none';
          if (e.error === 'language-not-supported' && hasMedia) {
            startMediaRecording();
          } else if (e.error === 'not-allowed' || e.error === 'permission-denied') {
            const t = getI18n();
            showError(t.micPermissionDenied || 'Microphone access denied. Please grant permission in browser settings.');
          } else if (e.error === 'no-speech') {
            const t = getI18n();
            showError(t.recNoSpeech || 'No speech detected. Please try again.');
          } else {
            showError('Voice input error: ' + e.error);
          }
        });
      } catch (_) {}
    }

    async function startMediaRecording() {
      const t = getI18n();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function (e) {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async function () {
          stream.getTracks().forEach(function (track) { track.stop(); });
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          if (audioBlob.size > 0) {
            await uploadAndTranscribe(audioBlob);
          } else {
            if (voiceStatusBanner) voiceStatusBanner.style.display = 'none';
            showError(t.recNoSpeech || 'No speech detected. Please try again.');
          }
        };

        mediaRecorder.start();
        setRecordingState(true);

        if (voiceStatusBanner) {
          voiceStatusBanner.className = 'voice-status-banner recording';
          voiceStatusBanner.style.display = 'flex';
          voiceStatusBanner.innerHTML = '<span class="rec-pulse-dot" aria-hidden="true"></span> <span>' + (t.recPrompt || 'Recording question... Speak now.') + '</span> <button type="button" class="btn-rec-stop" id="btn-banner-rec-stop">' + (t.stopAudio || 'Stop') + '</button>';
          const stopBtn = document.getElementById('btn-banner-rec-stop');
          if (stopBtn) {
            stopBtn.onclick = function (e) {
              e.stopPropagation();
              stopVoiceRecording();
            };
          }
        }
        speakFocus(t.recPrompt || 'Recording question... Speak now, then click Stop.');
      } catch (err) {
        setRecordingState(false);
        if (voiceStatusBanner) voiceStatusBanner.style.display = 'none';
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          showError(t.micPermissionDenied || 'Microphone access denied. Please grant permission in browser settings.');
        } else {
          showError('Microphone error: ' + (err.message || err));
        }
      }
    }

    async function uploadAndTranscribe(blob) {
      const t = getI18n();
      try {
        if (voiceStatusBanner) {
          voiceStatusBanner.className = 'voice-status-banner processing';
          voiceStatusBanner.style.display = 'flex';
          voiceStatusBanner.innerHTML = '<span class="thinking-dot" style="margin-right:6px"></span> <span>' + (t.recProcessing || 'Transcribing speech...') + '</span>';
        }
        speakFocus(t.recProcessing || 'Transcribing speech...');

        const formData = new FormData();
        formData.append('file', blob, 'recording.webm');
        formData.append('language', currentLanguage);

        const resp = await fetch(apiUrl + '/speech/transcribe', {
          method: 'POST',
          body: formData
        });

        if (resp.ok) {
          const data = await resp.json();
          if (data.text && data.text.trim()) {
            chatInput.value = (chatInput.value ? chatInput.value + ' ' : '') + data.text.trim();
            chatInput.dispatchEvent(new Event('input'));
            chatInput.focus();

            if (voiceStatusBanner) {
              voiceStatusBanner.className = 'voice-status-banner success';
              voiceStatusBanner.style.display = 'flex';
              voiceStatusBanner.textContent = t.recSuccess || '✓ Audio transcribed! You can edit text below before sending.';
              speakFocus(t.recSuccess || 'Speech transcribed. Review your question in the text box and press Send.');
              setTimeout(function () {
                if (voiceStatusBanner.classList.contains('success')) voiceStatusBanner.style.display = 'none';
              }, 4500);
            }
          } else {
            if (voiceStatusBanner) voiceStatusBanner.style.display = 'none';
            showError(t.recNoSpeech || 'No speech detected. Please try again.');
          }
        } else if (resp.status === 501) {
          if (voiceStatusBanner) voiceStatusBanner.style.display = 'none';
          showError('Speech transcription not implemented for this language.');
        } else {
          if (voiceStatusBanner) voiceStatusBanner.style.display = 'none';
          showError(t.recUnavailable || 'Transcription service currently unavailable. You can type your question.');
        }
      } catch (err) {
        if (voiceStatusBanner) voiceStatusBanner.style.display = 'none';
        showError(t.recUnavailable || 'Transcription error: ' + (err.message || err));
      }
    }

    voiceBtn.addEventListener('click', function () {
      if (isListening) {
        stopVoiceRecording();
      } else {
        const serverPreferredLanguages = ['am', 'om', 'ti', 'so'];
        if (serverPreferredLanguages.indexOf(currentLanguage) !== -1 && hasMedia) {
          startMediaRecording();
        } else if (hasMedia) {
          startMediaRecording();
        } else if (recognition) {
          try {
            recognition.lang = BCP47_MAP[currentLanguage] || 'en-US';
            recognition.start();
            setRecordingState(true);
            const t = getI18n();
            if (voiceStatusBanner) {
              voiceStatusBanner.className = 'voice-status-banner recording';
              voiceStatusBanner.style.display = 'flex';
              voiceStatusBanner.innerHTML = '<span class="rec-pulse-dot" aria-hidden="true"></span> <span>' + (t.recPrompt || 'Recording question... Speak now.') + '</span> <button type="button" class="btn-rec-stop" id="btn-banner-rec-stop">' + (t.stopAudio || 'Stop') + '</button>';
              const stopBtn = document.getElementById('btn-banner-rec-stop');
              if (stopBtn) {
                stopBtn.onclick = function (e) {
                  e.stopPropagation();
                  stopVoiceRecording();
                };
              }
            }
          } catch (_) {
            if (hasMedia) startMediaRecording();
          }
        }
      }
    });
  }

  setupVoice();

  /* ── Escalation flow ─────────────────────────────────────── */
  let mediaStream = null;

  function openEscalModal() {
    escalModal.removeAttribute('hidden');
    modalConfirm.focus();
    /* Trap focus in modal */
    escalModal.addEventListener('keydown', trapFocus);
  }

  function closeEscalModal() {
    escalModal.setAttribute('hidden', '');
    escalModal.removeEventListener('keydown', trapFocus);
    escalateBtn.focus();
  }

  function trapFocus(e) {
    if (e.key !== 'Tab') return;
    const focusable = escalModal.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
    const first = focusable[0];
    const last  = focusable[focusable.length - 1];
    if (e.shiftKey) {
      if (document.activeElement === first) { e.preventDefault(); last.focus(); }
    } else {
      if (document.activeElement === last)  { e.preventDefault(); first.focus(); }
    }
  }

  escalateBtn.addEventListener('click', openEscalModal);
  modalCancel.addEventListener('click', closeEscalModal);

  modalConfirm.addEventListener('click', async function () {
    closeEscalModal();
    let hasStream = false;

    // Step 1: Request screen share if supported (Chrome on Android does not support getDisplayMedia)
    if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
      try {
        mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        hasStream = true;
      } catch (mediaErr) {
        // Fall back gracefully to contextual assistance (Android / mobile support)
        console.warn('[Savanna escalation] Screen share skipped or unsupported on this device:', mediaErr.message);
      }
    }

    // Step 2: Build rich learner context packet
    const learnerContext = {
      parent_url: document.referrer || window.location.href,
      user_agent: navigator.userAgent,
      is_mobile: /Android|iPhone|iPad/i.test(navigator.userAgent),
      language: currentLanguage,
      has_screen_share: hasStream
    };

    try {
      /* Step 3: POST /escalate */
      const res = await fetch(apiUrl + '/escalate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          reason:     'User requested human assistance' + (hasStream ? ' (with screen share)' : ' (context-assisted)'),
          language:   currentLanguage,
          learner_context: learnerContext
        })
      });

      if (!res.ok) throw new Error('Escalation API error ' + res.status);
      const data = await res.json();
      const ticketId = data.ticket_id || data.id || 'N/A';

      /* Show confirmation */
      ticketZone.innerHTML = '';
      const conf = document.createElement('div');
      conf.className = 'ticket-confirm';
      conf.setAttribute('role', 'status');
      conf.textContent = '✓ Connected — Ticket #' + ticketId + '. An agent will join shortly.';
      ticketZone.appendChild(conf);

      // Notify parent host and custom element
      parent.postMessage({
        type: 'db-assistant:escalated',
        ticketId: ticketId,
        conversation: history
      }, '*');

    } catch (err) {
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      showError('Could not escalate: ' + err.message);
    }
  });

  /* Close modal on backdrop click */
  escalModal.addEventListener('click', function (e) {
    if (e.target === escalModal) closeEscalModal();
  });

  /* ── Escape key ──────────────────────────────────────────── */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!escalModal.hidden) { closeEscalModal(); return; }
      parent.postMessage({ type: 'close' }, '*');
    }
  });

})();
</script>
