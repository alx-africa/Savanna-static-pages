openapi: 3.1.0
info:
  title: Savanna Multilingual Assistant
  description: Voice and text AI tutor in Amharic and English. Answers questions from
    course content, escalates to humans, and surfaces career opportunities.
  version: 1.0.0
paths:
  /chat:
    post:
      tags:
      - Chat
      summary: Send a chat message
      description: 'Accept a chat message, run cross-lingual RAG retrieval, call the
        AI provider,

        and return a structured response with citations in the learner''s language.'
      operationId: chat_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /chat/history/{session_id}:
    get:
      tags:
      - Chat
      summary: Retrieve chat history for a session
      description: 'Return the stored message history for *session_id*.

        Returns an empty list if Redis is unavailable or the key does not exist.'
      operationId: get_history_chat_history__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
                title: Response Get History Chat History  Session Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escalate:
    post:
      tags:
      - Escalation
      summary: Escalate session to human operator
      description: 'Create an escalation ticket. Optionally stores a WebRTC SDP offer
        for

        screen-sharing sessions (the widget completes the negotiation).'
      operationId: escalate_escalate_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Escalation
      summary: List recent escalation tickets
      description: Return a list of recent escalation tickets for the operator dashboard.
      operationId: list_tickets_escalate_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Tickets Escalate Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escalate/{ticket_id}:
    get:
      tags:
      - Escalation
      summary: Check escalation ticket status
      description: Return the current status of an escalation ticket.
      operationId: get_ticket_escalate__ticket_id__get
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          title: Ticket Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Ticket Escalate  Ticket Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escalate/{ticket_id}/answer:
    post:
      tags:
      - Escalation
      summary: Operator submits SDP answer
      description: Save operator's WebRTC SDP answer and mark ticket active.
      operationId: set_ticket_answer_escalate__ticket_id__answer_post
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          title: Ticket Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Set Ticket Answer Escalate  Ticket Id  Answer Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs:
    get:
      tags:
      - Career Gateway
      summary: List all available jobs
      description: 'Return all jobs from jobs.json. Supports optional `keyword`, `type`,
        and `language`

        query-string filters. Keyword matching checks English and localized translations.'
      operationId: list_jobs_jobs_get
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by keyword in title, description, or skills
          title: Keyword
        description: Filter by keyword in title, description, or skills
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by job type (full-time, part-time, contract, remote)
          title: Type
        description: Filter by job type (full-time, part-time, contract, remote)
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Preferred language for localized job cards (am, om, ti, so,
            ar, sw, fr, en)
          title: Language
        description: Preferred language for localized job cards (am, om, ti, so, ar,
          sw, fr, en)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
                title: Response List Jobs Jobs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/schema:
    get:
      tags:
      - Career Gateway
      summary: Get schema.org/JobPosting JSON-LD for a job (Level 3 Open Standard)
      description: Return standard schema.org JSON-LD metadata for external search
        engines.
      operationId: get_job_schema_jobs__job_id__schema_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Job Schema Jobs  Job Id  Schema Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}:
    get:
      tags:
      - Career Gateway
      summary: Get a single job by ID
      description: Return a specific job entry by its ID, with optional language adaptation.
      operationId: get_job_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Preferred language for job details
          title: Language
        description: Preferred language for job details
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/answer:
    post:
      tags:
      - Career Gateway
      summary: Answer questions about a specific job using RAG
      description: 'Use the RAG retriever (domain=''jobs'') to answer questions about
        a specific job.

        Returns the answer text and any relevant citations.'
      operationId: answer_job_question_jobs__job_id__answer_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Answer Job Question Jobs  Job Id  Answer Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/alert:
    post:
      tags:
      - Career Gateway
      summary: Subscribe to job alerts (/jobs/alert)
      description: 'Store a job-alert subscription in Redis. The alert scheduler

        (api/jobs/alerts.py) picks up these subscriptions every 6 hours.'
      operationId: subscribe_job_alert_jobs_alert
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobAlertRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAlertResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/apply:
    post:
      tags:
      - Career Gateway
      summary: Submit a job application with optional interview accommodation (No
        medical proof needed)
      description: 'Submit an application for a specific job listing.

        Supports no-barrier interview accommodation requests without medical proof.

        Persists application in Redis and alerts operators.'
      operationId: apply_to_job_jobs__job_id__apply_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobApplicationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /job-alert:
    post:
      tags:
      - Career Gateway
      summary: Subscribe to job alerts (/job-alert)
      description: 'Store a job-alert subscription in Redis. The alert scheduler

        (api/jobs/alerts.py) picks up these subscriptions every 6 hours.'
      operationId: subscribe_job_alert_root
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobAlertRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAlertResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accommodate:
    post:
      tags:
      - Accommodation
      summary: Submit an accessibility / accommodation request
      description: 'Record an accommodation request and notify the accessibility coordinator.

        Responds in the requested language (8 supported languages: en, am, om, ti,
        so, ar, sw, fr).'
      operationId: accommodate_accommodate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /lti/login:
    get:
      tags:
      - LTI 1.3
      summary: LTI 1.3 OIDC login initiation (GET)
      description: 'Step 1 of the LTI 1.3 launch: receive the OIDC login hint from
        the

        platform and redirect back to the platform''s authorisation endpoint.


        The platform must be configured to send the user here before the launch.'
      operationId: lti_login_lti_login_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      tags:
      - LTI 1.3
      summary: LTI 1.3 OIDC login initiation (POST)
      description: 'Step 1 of the LTI 1.3 launch: receive the OIDC login hint from
        the

        platform and redirect back to the platform''s authorisation endpoint.


        The platform must be configured to send the user here before the launch.'
      operationId: lti_login_lti_login_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /lti/launch:
    post:
      tags:
      - LTI 1.3
      summary: LTI 1.3 resource launch
      description: 'Step 2 of the LTI 1.3 launch: validate the id_token JWT posted
        by the

        platform and redirect the browser to the widget with LTI context params.


        The widget URL is built from api_base_url; adjust as needed.'
      operationId: lti_launch_lti_launch_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /lti/jwks:
    get:
      tags:
      - LTI 1.3
      summary: Tool JSON Web Key Set (public key)
      description: 'Return the tool''s public RSA key as a JWK Set so the platform
        can verify

        tokens signed by this tool (e.g. for Deep Linking responses).'
      operationId: lti_jwks_lti_jwks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /webhook/sms:
    post:
      tags:
      - SMS Webhook
      summary: Africa's Talking inbound SMS webhook
      description: "Receive an inbound SMS from Africa's Talking and reply appropriately.\n\
        \nAT sends the payload as application/x-www-form-urlencoded with fields:\n\
        \  from, to, text, date, id, linkId, networkCode"
      operationId: sms_inbound_webhook_sms_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /webhook/sms/delivery:
    post:
      tags:
      - SMS Webhook
      summary: Africa's Talking SMS delivery report
      description: 'Receive delivery status reports from Africa''s Talking.

        We log the payload and always return 200 OK as AT expects.'
      operationId: sms_delivery_webhook_sms_delivery_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /teacher/analytics:
    get:
      tags:
      - Teacher Analytics
      summary: Get anonymous teacher analytics
      description: Return aggregated questions, top topics, and frequency without
        student identities.
      operationId: get_analytics_teacher_analytics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAnalyticsResponse'
  /teacher/export:
    get:
      tags:
      - Teacher Analytics
      summary: Export anonymous questions to CSV
      description: Download anonymous question dataset in CSV format.
      operationId: export_csv_teacher_export_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /describe-image:
    post:
      tags:
      - Vision & Image Accessibility
      summary: Get AI visual breakdown for an image
      description: 'Deliver an AI-powered visual breakdown of a course image or diagram

        for screen readers and speech synthesis in 8 languages.'
      operationId: describe_image_describe_image_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeImageRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeImageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /speech/voices:
    get:
      tags:
      - Speech & Voice Accessibility
      - Speech & Voice Accessibility
      summary: Get available TTS voices across supported languages
      description: Return verified available neural voices categorized by language
        from the active TTS provider.
      operationId: list_voices_speech_voices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    $ref: '#/components/schemas/VoiceInfo'
                  type: array
                type: object
                title: Response List Voices Speech Voices Get
  /speech/synthesize:
    post:
      tags:
      - Speech & Voice Accessibility
      - Speech & Voice Accessibility
      summary: Synthesize natural speech from text across supported languages
      description: 'Synthesize text into speech audio.

        Supports languages with verified voices from the active provider.

        Returns 501 Not Implemented if speech synthesis is unavailable for the requested
        language.'
      operationId: synthesize_speech_speech_synthesize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /speech/transcribe:
    post:
      tags:
      - Speech & Voice Accessibility
      - Speech & Voice Accessibility
      summary: Transcribe audio speech to text with language detection
      description: 'Transcribe speech audio into text using the configured ASR provider
        (Addis AI, Whisper, etc.).

        Returns 503 Service Unavailable when no genuine speech-to-text provider is
        configured or reachable.'
      operationId: transcribe_speech_speech_transcribe_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_transcribe_speech_speech_transcribe_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscribeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /translate:
    post:
      tags:
      - Translation
      - Translation
      summary: Batch translate web content
      description: 'Translate a batch of website text nodes into the requested target
        language.

        Uses multi-tier caching (in-memory + disk cache) and high-speed LLM translation.'
      operationId: batch_translate_translate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTranslateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTranslateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /translate/cache/stats:
    get:
      tags:
      - Translation
      - Translation
      summary: Get translation cache metrics
      description: Return translation cache metrics.
      operationId: get_cache_stats_translate_cache_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Cache Stats Translate Cache Stats Get
  /api/v1/ask:
    post:
      tags:
      - Level 2 Contract
      summary: Ask the tutor (Level 2 Technical Guide Contract)
      description: "Data contract:\n  POST /api/v1/ask { question, language } -> {\
        \ answer, sources: [{ title, url, id }] }"
      operationId: ask_v1_api_v1_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskV1Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskV1Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content:
    post:
      tags:
      - Level 2 Contract
      summary: Index host lessons (Level 2 Technical Guide Contract)
      description: "Data contract:\n  POST /api/v1/content\n  The host sends its lessons\
        \ to be indexed dynamically."
      operationId: index_content_v1_api_v1_content_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentV1Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentV1Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/escalations:
    post:
      tags:
      - Level 2 Contract
      summary: Escalate to human tutor (Level 2 Technical Guide Contract)
      description: "Data contract:\n  POST /api/v1/escalations { conversation } ->\
        \ { ticketId }"
      operationId: escalate_v1_api_v1_escalations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationV1Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationV1Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sms/inbound:
    post:
      tags:
      - Level 2 Contract
      summary: Text/SMS route (Level 2 Technical Guide Contract)
      description: "Data contract:\n  POST /sms/inbound { from, text } -> plain text\
        \ reply of at most 160 characters.\n  Accepts both JSON and form-urlencoded\
        \ payloads."
      operationId: sms_inbound_v1_api_v1_sms_inbound_post
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
  /ask:
    post:
      tags:
      - Level 2 Contract
      summary: Ask the tutor (Level 2 Technical Guide Contract)
      description: "Data contract:\n  POST /api/v1/ask { question, language } -> {\
        \ answer, sources: [{ title, url, id }] }"
      operationId: ask_v1_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskV1Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskV1Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /content:
    post:
      tags:
      - Level 2 Contract
      summary: Index host lessons (Level 2 Technical Guide Contract)
      description: "Data contract:\n  POST /api/v1/content\n  The host sends its lessons\
        \ to be indexed dynamically."
      operationId: index_content_v1_content_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentV1Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentV1Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escalations:
    post:
      tags:
      - Level 2 Contract
      summary: Escalate to human tutor (Level 2 Technical Guide Contract)
      description: "Data contract:\n  POST /api/v1/escalations { conversation } ->\
        \ { ticketId }"
      operationId: escalate_v1_escalations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationV1Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationV1Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sms/inbound:
    post:
      tags:
      - Level 2 Contract
      summary: Text/SMS route (Level 2 Technical Guide Contract)
      description: "Data contract:\n  POST /sms/inbound { from, text } -> plain text\
        \ reply of at most 160 characters.\n  Accepts both JSON and form-urlencoded\
        \ payloads."
