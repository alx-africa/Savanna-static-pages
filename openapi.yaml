info:
  description: Voice and text AI tutor in Amharic and English. Answers questions from
    course content, escalates to humans, and surfaces career opportunities.
  title: Savanna Multilingual Assistant
  version: 1.0.0
openapi: 3.1.0
paths:
  /accommodate:
    post:
      description: 'Record an accommodation request and notify the accessibility coordinator.

        Responds in the requested language (8 supported languages: en, am, om, ti,
        so, ar, sw, fr).'
      operationId: accommodate_accommodate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Submit an accessibility / accommodation request
      tags:
      - Accommodation
  /api/speech/synthesize:
    post:
      description: 'Synthesize text into speech audio.

        Supports languages with verified voices from the active provider.

        Returns 501 Not Implemented if speech synthesis is unavailable for the requested
        language.'
      operationId: synthesize_speech_api_speech_synthesize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesizeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Synthesize natural speech from text across supported languages
      tags:
      - Speech & Voice Accessibility
      - Speech & Voice Accessibility
  /api/speech/transcribe:
    post:
      description: 'Transcribe speech audio into text using the configured ASR provider
        (Addis AI, Whisper, etc.).

        Returns 503 Service Unavailable when no genuine speech-to-text provider is
        configured or reachable.'
      operationId: transcribe_speech_api_speech_transcribe_post
      requestBody:
        content:
